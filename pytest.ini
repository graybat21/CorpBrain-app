[pytest]
testpaths = tests

# `pythonpath` (pytest >= 7) puts the repo root on sys.path so `import src.backend...`
# resolves. Without it, only `python -m pytest` worked (the -m form injects CWD) and a
# bare `pytest tests/` failed on import — CLAUDE.md §6 documents the bare form.
# A root conftest.py would also work but would change rootdir semantics.
pythonpath = .

markers =
    ollama: requires a running local Ollama daemon on 127.0.0.1:11434; opt-in via CORPBRAIN_TEST_OLLAMA=1
